[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankhub"
version = "0.3.0"
description = "A universal hub for personal-finance data: many sources (CSV, OFX, Plaid, SimpleFIN, …) feed one normalised model, de-duplicated and fanned out to many destinations (Lunchmoney, YNAB, Actual, …)."
readme = "README.md"
requires-python = ">=3.9"
# NOTE: no LICENSE file exists yet and this is a fork of pigri/banker. Confirm
# the intended license and add a LICENSE file before publishing to PyPI.
keywords = ["finance", "banking", "lunchmoney", "ynab", "actual", "plaid",
            "simplefin", "ofx", "mt940", "camt", "csv", "etl", "aggregator"]
authors = [{ name = "banker contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]

# Core runtime deps.  The model + file-format sources (csv/ofx/qif/mt940/camt)
# and CSV/JSON destinations work with just these.
dependencies = [
    "click>=8.0",
    "peewee>=3.14",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
# HTTP-based connectors and the Lunchmoney/YNAB destinations.
http = ["requests>=2.25"]
connectors = ["requests>=2.25"]
# PDF statement source.
pdf = ["pdfplumber>=0.7"]
# Actual Budget destination.
actual = ["actualpy>=0.5"]
# Everything optional, for "give me all integrations".
all = ["requests>=2.25", "pdfplumber>=0.7", "actualpy>=0.5"]
# Tooling for contributors.
dev = ["pylint", "autopep8", "build", "requests>=2.25"]

[project.urls]
Homepage = "https://github.com/latetedemelon/banker"
Repository = "https://github.com/latetedemelon/banker"
Issues = "https://github.com/latetedemelon/banker/issues"

[project.scripts]
bankhub = "bankhub.cli:main"

[tool.setuptools]
# Ship the package and its YAML data, nothing else.
packages = [
    "bankhub",
    "bankhub.sources",
    "bankhub.destinations",
]

[tool.setuptools.package-data]
bankhub = ["data/*.yml"]
