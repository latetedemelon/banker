name: Banker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        # Core first so the adapter packages resolve bankhub-core locally.
        # The [xlsx] extra pulls openpyxl so the Excel read/write path is tested.
        run: |
          pip install ./bankhub-core
          pip install "./bankhub-files[xlsx]" ./bankhub-connectors
      - name: Run tests
        run: python run_tests.py
        env:
          ENV: test
